<!DOCTYPE html>
<html lang="es">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAL_STORE💋 | Premium Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --brand-red: #E01E37; --bg-dark: #080808; --font-body: 'DM Sans', sans-serif; --font-display: 'Playfair Display', serif; }
        body { font-family: var(--font-body); background-color: var(--bg-dark); color: #ffffff; overflow-x: hidden; margin: 0; }

        .brand-wordmark {
            font-family: var(--font-display); font-style: italic; letter-spacing: -0.06em;
            background: linear-gradient(110deg, #fff 20%, #fff 42%, #E01E37 50%, #fff 58%, #fff 80%);
            background-size: 220% auto; background-clip: text; -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; animation: brandShine 6s linear infinite;
        }
        .brand-bounce { display: inline-block; animation: brandBounce 3.6s ease-in-out infinite; }
        @keyframes brandBounce {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            5% { transform: translateY(-4px) rotate(0deg); }
            10% { transform: translateY(0) rotate(-1deg); }
            88% { transform: translateY(0) rotate(-1deg); }
        }
        @keyframes brandShine { to { background-position: -220% center; } }
        .kiss-mark { display: inline-block; position: relative; animation: brandKissPulse 4.8s ease-in-out infinite; }
        .header-kiss { cursor: pointer; }
        .kiss-emoji {
            display: inline-block; cursor: pointer; user-select: none;
            animation: kissPulse 2s infinite ease-in-out;
            transition: transform 0.2s;
        }
        .kiss-o {
            display: inline-block; color: #e60023; -webkit-text-fill-color: #e60023;
            background: none; opacity: 1; cursor: pointer; transform-origin: center;
            user-select: none; font-style: normal; line-height: 1;
            animation: kissPulse 2s infinite ease-in-out;
            filter: drop-shadow(0 2px 4px rgba(230,0,35,0.28));
        }
        .kiss-o.intro-title-letter { animation: kissPulse 2s infinite ease-in-out; }
        .kiss-mark::after, .kiss-mark::before {
            content: '♥'; position: absolute; color: #E01E37; font-size: 0.34em; opacity: 0;
            pointer-events: none; animation: kissHeart 4.8s ease-out infinite;
        }
        .kiss-mark::before { top: 4%; right: -35%; }
        .kiss-mark::after { top: 28%; left: -28%; animation-delay: 0.18s; }
        @keyframes brandKissPulse {
            0%, 78%, 100% { transform: scale(1) rotate(0deg); }
            82% { transform: scale(1.12) rotate(-5deg); }
            86% { transform: scale(0.98) rotate(3deg); }
            90% { transform: scale(1.06) rotate(0deg); }
        }
        @keyframes kissPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3) rotate(-5deg); }
        }
        @keyframes kissHeart {
            0%, 78% { opacity: 0; transform: translate(0, 8px) scale(0.4); }
            83% { opacity: 1; }
            100% { opacity: 0; transform: translate(12px, -22px) scale(1); }
        }

        /* --- NUEVA ANIMACIÓN INICIAL ULTRA CORREGIDA Y COMPATIBLE --- */
        #intro-bg {
            position: fixed; inset: 0; background: #17232c; z-index: 150;
            transition: opacity 0.6s ease-in-out;
        }

        #animated-logo {
            position: fixed; z-index: 200; white-space: nowrap;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; opacity: 0;
            animation: elegantFade 2.2s ease-in-out forwards;
        }
        @media (min-width: 768px) { #animated-logo { font-size: 5rem; } }

        @keyframes elegantFade {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
            25% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            75% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05); }
        }

        /* --- PANTALLA HERO --- */
        #hero {
            position: fixed; inset: 0; z-index: 100;
            background: radial-gradient(circle at 50% 40%, #3c4b56 0%, #25343e 44%, #10191f 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.8s ease, transform 0.8s ease, perspective 0.8s ease;
            perspective: 1200px; transform-style: preserve-3d;
        }
        /* Brillo de fondo */
        .glow-hero {
            position: absolute; width: 52vw; height: 52vw; max-width: 560px; max-height: 560px;
            background: #8eb7c6; filter: blur(110px); opacity: 0.24;
        }

        .intro-stage {
            position: relative; z-index: 2; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 1.75rem;
            transform-style: preserve-3d; transition: transform 0.18s ease-out;
            will-change: transform;
        }
        .intro-panel {
            display: flex; flex-direction: column; align-items: center; gap: 0.9rem;
            padding: 2.5rem 3.5rem 2.25rem; border: 1px solid rgba(255,255,255,0.76);
            border-radius: 30px; background: rgba(255,255,255,0.56); backdrop-filter: blur(20px);
            box-shadow: 0 28px 70px rgba(61,87,105,0.16), inset 0 1px rgba(255,255,255,0.9);
            transform: translateZ(35px); transform-style: preserve-3d;
        }
        .intro-brand { color: #142531; text-align: center; }
        .intro-brand .brand-wordmark {
            background: none; -webkit-text-fill-color: #18242c; color: #18242c;
            text-shadow: 0 3px 0 rgba(255,255,255,0.7), 0 8px 18px rgba(20,37,49,0.2);
        }
        .intro-title-letter { display: inline-block; animation: introLetterWave 3.8s ease-in-out infinite; }
        @keyframes introLetterWave {
            0%, 76%, 100% { transform: translateY(0) rotate(0); }
            82% { transform: translateY(-6px) rotate(-2deg); }
            88% { transform: translateY(1px) rotate(1deg); }
        }
        .intro-kiss { margin-top: -0.25rem; font-size: 2rem; filter: drop-shadow(0 6px 8px rgba(224,30,55,0.18)); }
        .intro-button {
            transform: translateZ(52px); color: #fff; border: 1px solid rgba(255,255,255,0.7);
            background: rgba(20,37,49,0.88); box-shadow: 0 14px 30px rgba(20,37,49,0.2);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }
        .intro-button:hover { transform: translateZ(70px) scale(1.05); background: var(--brand-red); box-shadow: 0 16px 35px rgba(224,30,55,0.22); }
        #hero.intro-exit .intro-stage { animation: introExit 0.8s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
        @keyframes introExit {
            to { opacity: 0; transform: translate3d(0, -10vh, 180px) rotateX(-14deg) scale(1.08); }
        }

        /* Bloque patriótico opcional: puede retirarse sin afectar la base 3D. */
        .tematica-patria { position: absolute; inset: 0; pointer-events: none; }
        .patrio-centerpiece {
            position: absolute; top: 50%; left: 50%; width: min(24vw, 210px); aspect-ratio: 3 / 2;
            transform: translate(-50%, -50%) translateZ(-30px) rotateY(-8deg);
            opacity: 0.38; filter: drop-shadow(0 12px 18px rgba(61,87,105,0.28));
        }
        .patrio-centerpiece img { width: 100%; height: 100%; object-fit: contain; }

        /* Elementos patrios decorativos de la pantalla de entrada */
        .patrio-rain {
            position: absolute; inset: 0; overflow: hidden; pointer-events: none;
        }
        .falling-flag, .falling-torch {
            position: absolute; top: 0; left: var(--left);
            animation: patriaCascade var(--duration) linear var(--delay) infinite;
            will-change: transform;
        }
        .falling-flag {
            width: 30px; height: 20px; display: block; opacity: 0.72;
            filter: drop-shadow(0 5px 8px rgba(61,87,105,0.24));
            transform-origin: center;
        }
        .falling-flag img {
            display: block; width: 100%; height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            animation: flagWave3D 1.8s ease-in-out infinite;
        }
        .falling-torch {
            width: 22px; height: 30px; display: block;
            filter: drop-shadow(0 0 10px rgba(255, 133, 22, 0.5));
            transform-origin: center top;
        }
        .falling-torch svg {
            display: block; width: 100%; height: 100%; overflow: visible;
            animation: torchGlow 1.1s ease-in-out infinite alternate;
        }
        .torch-flame {
            transform-box: fill-box; transform-origin: center bottom;
            animation: flame 0.55s ease-in-out infinite alternate, flameFlicker 0.8s ease-in-out infinite alternate;
        }
        .torch-spark { animation: sparks 0.9s ease-in-out infinite alternate; }
        .product-size {
            color: #fff; font-size: 0.9rem; font-weight: 700;
            letter-spacing: 0.08em; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        @media (min-width: 768px) { .product-size { font-size: 1rem; } }
        @keyframes flagWave3D {
            0%, 100% { transform: perspective(260px) rotateY(-7deg) skewY(0deg) scaleX(1); }
            50% { transform: perspective(260px) rotateY(10deg) skewY(3deg) scaleX(0.92); }
        }
        @keyframes patrioDrift {
            from { transform: translate3d(-5px, 3px, 0) rotate(-3deg); }
            to { transform: translate3d(5px, -5px, 0) rotate(3deg); }
        }
        @keyframes patriaCascade {
            0% { opacity: 0; transform: translate3d(0, -18vh, 0) rotate(var(--rotation-start)) scale(0.82); }
            12% { opacity: 0.82; }
            50% { opacity: 0.7; transform: translate3d(var(--drift), 55vh, 0) rotate(calc(var(--rotation-start) + 15deg)) scale(1); }
            88% { opacity: 0.5; }
            100% { opacity: 0; transform: translate3d(calc(var(--drift) * -0.55), 120vh, 0) rotate(calc(var(--rotation-start) - 12deg)) scale(0.9); }
        }
        @keyframes flame {
            to { transform: rotate(8deg) scale(0.86, 1.12); opacity: 0.82; }
        }
        @keyframes flameFlicker {
            0%, 100% { filter: brightness(1) saturate(1); }
            45% { filter: brightness(1.3) saturate(1.2); }
            70% { filter: brightness(0.88) saturate(0.9); }
        }
        @keyframes torchGlow {
            from { filter: drop-shadow(0 0 7px rgba(255,133,22,0.42)); }
            to { filter: drop-shadow(0 0 18px rgba(255,173,45,0.9)); }
        }
        @keyframes sparks {
            to { transform: translate(8px, -9px); opacity: 0.35; }
        }
        .heart-particle {
            position: fixed; z-index: 450; pointer-events: none; line-height: 1;
            font-size: var(--heart-size); opacity: 0;
            animation: heartRise var(--heart-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
            will-change: transform, opacity;
        }
        @keyframes heartRise {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.35) rotate(0deg); }
            14% { opacity: 1; }
            100% { opacity: 0; transform: translate(calc(-50% + var(--heart-x)), calc(-50% - var(--heart-y))) scale(1.15) rotate(var(--heart-rotation)); }
        }
        @media (prefers-reduced-motion: reduce) {
            .falling-flag, .falling-flag img, .falling-torch, .falling-torch svg, .torch-flame, .torch-spark, .intro-stage, .intro-title-letter, .heart-particle { animation-play-state: paused; transition: none; }
        }

        /* --- UI COMPONENTS --- */
        .glass-nav {
            background: rgba(8, 8, 8, 0.85); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            opacity: 0; transition: opacity 0.8s ease;
        }

        .category-btn {
            position: relative; font-weight: 600; font-size: 0.8rem; color: #888;
            transition: all 0.3s; padding: 0.5rem 1rem;
        }
        .category-btn.active { color: #fff; }
        .category-btn.active::after {
            content: ''; position: absolute; bottom: 0; left: 25%; width: 50%;
            height: 2px; background: var(--brand-red);
        }

        .catalog-search {
            display: flex; align-items: center; gap: 0.55rem; min-width: 170px;
            color: rgba(255,255,255,0.72); background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 999px;
            padding: 0.55rem 0.85rem; transition: border-color 0.25s, background 0.25s;
        }
        .catalog-search:focus-within { background: rgba(255,255,255,0.11); border-color: rgba(224,30,55,0.75); }
        .catalog-search input {
            width: 100%; min-width: 0; color: #fff; background: transparent; border: 0; outline: 0;
            font: 500 0.78rem var(--font-body);
        }
        .catalog-search input::placeholder { color: rgba(255,255,255,0.48); }
        .empty-results {
            grid-column: 1 / -1; min-height: 180px; display: grid; place-items: center;
            color: rgba(255,255,255,0.62); text-align: center; font-size: 0.95rem;
        }

        .product-card {
            background: #111; border-radius: 16px; overflow: hidden;
            transition: all 0.4s ease; border: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }
        .product-card:hover { transform: translateY(-5px); border-color: rgba(224, 30, 55, 0.4); }

        /* Animación de entrada de productos */
        .reveal-up { animation: revealUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; opacity: 0; }
        @keyframes revealUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Nueva animación visual para prendas en el modal */
        @keyframes imagePop {
            0% { opacity: 0; transform: scale(0.9) translateY(15px); filter: blur(5px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        .anim-pop {
            animation: imagePop 0.45s ease-in-out forwards;
            will-change: opacity, transform, filter;
        }

        #m-img {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        .cart-flight {
            position: fixed; z-index: 500; pointer-events: none; color: #E01E37;
            animation: cartFly 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes cartFly {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(115vw, -12vh) scale(0.7) rotate(18deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .brand-bounce, .kiss-mark, .kiss-mark::before, .kiss-mark::after, .cart-flight { animation: none; }
        }

        /* Ocultar barra de scroll en el modal en móviles */
        .no-scrollbar::-webkit-scrollbar { display: none; }

        @media (max-width: 768px) {
            #hero {
                max-width: 100vw; overflow-x: hidden; box-sizing: border-box;
                padding: 0 15px;
            }
            .intro-stage { width: 100%; max-width: 100%; box-sizing: border-box; }
            .intro-panel {
                width: min(100%, 22rem); max-width: 100%; box-sizing: border-box;
                padding: 2rem 1.25rem 1.75rem;
            }
            .intro-brand { max-width: 100%; width: 100%; box-sizing: border-box; text-align: center; }
            .intro-brand .brand-wordmark {
                max-width: 100%; box-sizing: border-box;
                width: 100%; font-size: clamp(1.4rem, 6.5vw, 2.5rem);
                text-align: center; white-space: nowrap; overflow: hidden;
            }
            .intro-button { max-width: 100%; padding-left: 1.75rem; padding-right: 1.75rem; }

            #main-nav {
                position: relative !important; padding: 8px 12px; box-sizing: border-box;
            }
            #main-nav > div {
                display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
                gap: 8px; width: 100%; max-width: none;
            }
            #main-nav .brand-logo {
                order: 1; flex: 0 1 auto; width: auto; max-width: 100%;
                min-width: 0; font-size: 1.1rem; white-space: nowrap;
            }
            #main-nav > div > .flex.items-center {
                order: 2; flex: 1 1 100%; min-width: 0; width: 100%;
                display: flex; align-items: center; justify-content: flex-end; gap: 8px;
            }
            #main-nav .catalog-search {
                flex: 1 1 auto; min-width: 130px; max-width: none;
                height: 32px; max-width: 160px; padding: 2px 10px;
                font-size: 0.8rem; box-sizing: border-box;
            }
            #main-nav .catalog-search input { font-size: 0.8rem; min-width: 0; }
            #main-nav > div > .flex.items-center > a,
            #main-nav #music-control {
                flex: 0 0 auto; min-width: 36px; min-height: 36px;
                display: inline-flex; align-items: center; justify-content: center;
                padding: 8px; box-sizing: border-box;
            }
            #main-nav #music-control { padding-left: 8px; border-left: 1px solid rgba(255,255,255,0.2); }

            #mobile-nav {
                clear: both; display: flex; position: relative; z-index: 80;
                flex-wrap: wrap; width: 100%; box-sizing: border-box;
                margin-top: 10px !important; padding: 0 12px;
            }
        }
    </style>
</head>

        VAL_ST<span class="kiss-o">💋</span>RE
    </div>

    <div id="intro-bg"></div>

    <section id="hero">
        <div class="glow-hero"></div>
        <div class="tematica-patria" aria-hidden="true">
            <div class="patrio-centerpiece">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/ec/Flag_of_Guatemala.svg" alt="Bandera de Guatemala con escudo nacional">

            <span class="falling-flag" style="--left: 25%; --top: 39%; --duration: 5.2s; --delay: -2s"><img src="https://upload.wikimedia.org/wikipedia/commons/e/ec/Flag_of_Guatemala.svg" alt="Bandera oficial de Guatemala"></span>

        </div>
        <div class="intro-stage" id="intro-stage">
            <div class="intro-panel">
                <div class="intro-brand">
                    <div class="brand-wordmark text-4xl md:text-6xl font-bold" aria-label="VAL_ST💋RE">

    <nav id="main-nav" class="glass-nav fixed top-0 w-full z-[90] px-4 md:px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="brand-logo brand-wordmark brand-bounce w-[120px] md:w-[150px] font-bold text-lg md:text-xl" id="headerLogo">VAL_ST<span id="interactiveKiss" class="kiss-o" role="button" tabindex="0" aria-label="Enviar besos">💋</span>RE</div>

                <button onclick="filterItems('Mujer')" class="category-btn active">Mujer</button>
                <button onclick="filterItems('Hombre')" class="category-btn">Hombre</button>
                <button onclick="filterItems('Niñ@s')" class="category-btn">Niñ@s</button>

            <div class="flex items-center gap-3 md:gap-5">

            prenda.id = `#${String(index + 1).padStart(3, '0')}`;
        });

        let indexActual = 0;
        let currentFilter = 'Mujer';
        let searchQuery = '';
        let carrito = JSON.parse(localStorage.getItem('val_store_cart')) || [];
        const bgMusic = document.getElementById('bg-music');
        const canciones = [
            'musica/cancion1.mp3',
            'musica/cancion2.mp3',
            'musica/cancion3.mp3'
        ];
        let cancionesDisponibles = [...canciones];
        let indiceCancion = Math.floor(Math.random() * cancionesDisponibles.length);
        [cancionesDisponibles[0], cancionesDisponibles[indiceCancion]] = [cancionesDisponibles[indiceCancion], cancionesDisponibles[0]];
        indiceCancion = 0;
        bgMusic.src = cancionesDisponibles[indiceCancion];

        function reproducirSiguiente() {
            indiceCancion++;
            if (indiceCancion >= cancionesDisponibles.length) {
                cancionesDisponibles = [...canciones].sort(() => Math.random() - 0.5);
                indiceCancion = 0;
            }
            bgMusic.src = cancionesDisponibles[indiceCancion];
            bgMusic.play().catch(e => console.log("Permiso de audio bloqueado", e));
        }

        bgMusic.addEventListener('ended', reproducirSiguiente);

        function lanzarParticulas(iconId, symbol) {
            const icon = document.getElementById(iconId);
            if (!icon) return;

            const bounds = icon.getBoundingClientRect();
            const particleCount = 7;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('span');
                particle.className = 'patrio-particle';
                particle.textContent = symbol;
                particle.style.left = `${bounds.left + bounds.width / 2}px`;
                particle.style.top = `${bounds.top + bounds.height / 2}px`;
                particle.style.setProperty('--particle-size', `${10 + Math.random() * 5}px`);
                particle.style.setProperty('--particle-x', `${(Math.random() - 0.5) * 90}px`);
                particle.style.setProperty('--particle-y', `${45 + Math.random() * 75}px`);
                particle.style.setProperty('--particle-rotation', `${(Math.random() - 0.5) * 45}deg`);
                particle.addEventListener('animationend', () => particle.remove(), { once: true });
                document.body.appendChild(particle);
            }
        }

        function prepararLluviaPatria() {
            document.querySelectorAll('.tematica-patria .falling-flag, .tematica-patria .falling-torch').forEach(element => {
                element.style.setProperty('--left', `${Math.random() * 100}%`);
                element.style.setProperty('--duration', `${6 + Math.random() * 6}s`);
                element.style.setProperty('--delay', `${-Math.random() * 12}s`);
                element.style.setProperty('--drift', `${-70 + Math.random() * 140}px`);
                element.style.setProperty('--rotation-start', `${-18 + Math.random() * 36}deg`);
            });
        }

        function createHeartShower(x, y) {
            const kiss = document.getElementById('interactiveKiss') || document.querySelector('.kiss-o');
            if (!kiss) return;

            const bounds = kiss.getBoundingClientRect();
            const symbols = ['💖', '❤️', '💋', '💕'];
            const originX = x || bounds.left + bounds.width / 2;
            const originY = y || bounds.top + bounds.height / 2;
            for (let index = 0; index < 15; index++) {
                const particle = document.createElement('span');
                particle.className = 'heart-particle';
                particle.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                particle.style.left = `${originX + (Math.random() * 100 - 50)}px`;
                particle.style.top = `${originY}px`;
                particle.style.setProperty('--heart-size', `${12 + Math.random() * 13}px`);
                particle.style.setProperty('--heart-duration', `${1.1 + Math.random() * 0.8}s`);
                particle.style.setProperty('--heart-x', `${-150 + Math.random() * 300}px`);
                particle.style.setProperty('--heart-y', `${90 + Math.random() * 150}px`);
                particle.style.setProperty('--heart-rotation', `${-35 + Math.random() * 70}deg`);
                particle.addEventListener('animationend', () => particle.remove(), { once: true });
                document.body.appendChild(particle);
            }
        }

        prepararLluviaPatria();
        document.querySelectorAll('.kiss-o').forEach(kiss => {
            kiss.addEventListener('click', event => createHeartShower(event.clientX, event.clientY));
            kiss.addEventListener('touchstart', event => {
                event.preventDefault();
                const touch = event.changedTouches[0];
                createHeartShower(touch ? touch.clientX : undefined, touch ? touch.clientY : undefined);
            }, { passive: false });
            kiss.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    createHeartShower();
                }
            });
        });

        document.addEventListener("visibilitychange", function() {
            if (document.hidden && !bgMusic.paused) {
                bgMusic.pause();
                document.getElementById('music-control').style.opacity = '0.5';
            }
        });

        const hero = document.getElementById('hero');
        const introStage = document.getElementById('intro-stage');
        const cartToggle = document.getElementById('cart-toggle-btn');
        let catalogActive = false;

        function moverEntrada3D(clientX, clientY) {
            if (!introStage || hero.style.display === 'none') return;
            const x = (clientX / window.innerWidth - 0.5) * 2;
            const y = (clientY / window.innerHeight - 0.5) * 2;
            introStage.style.transform = `rotateX(${y * -4}deg) rotateY(${x * 5}deg)`;
        }

        hero.addEventListener('pointermove', event => moverEntrada3D(event.clientX, event.clientY));
        hero.addEventListener('pointerleave', () => {
            if (introStage) introStage.style.transform = '';
        });

        window.addEventListener('scroll', () => {
            if (catalogActive && window.scrollY > 40) cartToggle.classList.remove('hidden');
        }, { passive: true });

        /* DISPARADOR ULTRA-RÁPIDO QUE EVITA LA PANTALLA NEGRA */
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('intro-bg').style.opacity = '0';
                document.getElementById('animated-logo').style.opacity = '0';
                document.getElementById('hero').style.opacity = '1';
                setTimeout(() => {
                    document.getElementById('intro-bg').style.display = 'none';
                    document.getElementById('animated-logo').style.display = 'none';
                }, 600);
            }, 1800);
            actualizarUI_Carrito();
        });

        function startExperience() {
            catalogActive = true;
            cartToggle.classList.remove('hidden');
            cartToggle.classList.add('flex');
            hero.classList.add('intro-exit');
            hero.style.opacity = '0';
            hero.style.transform = 'translateY(-2%) rotateX(2deg)';
            hero.style.pointerEvents = 'none';
            setTimeout(() => hero.style.display = 'none', 800);
            
            document.getElementById('main-nav').style.opacity = '1';
            document.getElementById('mobile-nav').style.opacity = '1';
            bgMusic.play().catch(e => console.log("Permiso de audio bloqueado", e));
            renderGaleria();
        }

        function filterItems(category) {
            currentFilter = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.includes(category)) btn.classList.add('active');
            });
            renderGaleria();
        }

        function normalizarTexto(value) {
            return value.toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        document.getElementById('catalog-search-input').addEventListener('input', event => {
            searchQuery = event.target.value;
            renderGaleria();
        });

        function renderGaleria() {
            const container = document.getElementById('galeria');
            container.innerHTML = '';
            
            let filtered = prendas.filter(p => {
                const coincideCategoria = currentFilter === 'Oferta' ? p.oferta === true : p.cat === currentFilter;
                const termino = normalizarTexto(searchQuery.trim().replace(/^#/, ''));
                const coincideBusqueda = !termino || normalizarTexto(p.titulo).includes(termino) || normalizarTexto(p.id).replace(/^#/, '').includes(termino);
                return coincideCategoria && coincideBusqueda;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p class="empty-results">No se encontraron prendas que coincidan con tu búsqueda 💋</p>';
                return;
            }

            filtered.forEach((p, i) => {
                const globalIndex = prendas.indexOf(p);
                const esVendida = p.precio.toUpperCase().includes('VENDID');
                container.innerHTML += `
                    <div class="product-card group reveal-up" data-id="${p.id}" style="animation-delay: ${i*0.08}s" onclick="abrirModal(${globalIndex})">
                        <div class="relative overflow-hidden aspect-[3/4]">
                            <img src="${p.img}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 ${esVendida ? 'opacity-40 grayscale' : ''}">
                            ${esVendida ? '<div class="absolute inset-0 flex items-center justify-center bg-black/40 font-black text-xs tracking-widest text-red-500 uppercase">AGOTADO</div>' : ''}
                        </div>
                        <div class="p-4 md:p-6">
                            <p class="text-[8px] font-black tracking-[0.2em] md:tracking-[0.3em] text-[#E01E37] uppercase">${p.marca}</p>
                            <h3 class="text-xs md:text-sm font-bold truncate mt-1">${p.titulo}</h3>
                            <div class="flex justify-between items-center mt-2 md:mt-4">
                                <span class="font-black text-sm md:text-lg ${esVendida ? 'text-red-500 font-medium' : ''}">${p.precio}</span>
                                <span class="text-[9px] md:text-[10px] text-gray-500 font-mono">${p.id}</span>
                            </div>
                            <div class="flex justify-between items-center mt-1">
                                <span class="product-size font-mono">${p.talla}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function abrirModal(index) {
            indexActual = index;
            actualizarModal();
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function cerrar() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        function cambiarPrenda(dir) {
            let filtered = prendas.filter(p => {
                if(currentFilter === 'Oferta') return p.oferta === true;
                return p.cat === currentFilter;
            });
            let currentFilteredIndex = filtered.indexOf(prendas[indexActual]);
            currentFilteredIndex += dir;
            if(currentFilteredIndex < 0) currentFilteredIndex = filtered.length - 1;
            if(currentFilteredIndex >= filtered.length) currentFilteredIndex = 0;
            indexActual = prendas.indexOf(filtered[currentFilteredIndex]);
            actualizarModal();
        }

        function actualizarModal() {
            const p = prendas[indexActual];
            const imgElement = document.getElementById('m-img');
            imgElement.src = p.img;
            imgElement.classList.remove('anim-pop');
            void imgElement.offsetWidth; 
            imgElement.classList.add('anim-pop');

            document.getElementById('m-marca').innerText = p.marca;
            document.getElementById('m-titulo').innerText = p.titulo;
            document.getElementById('m-precio').innerText = p.precio;
            document.getElementById('m-talla').innerText = `Talla: ${p.talla}`;
            
            const btnCarrito = document.getElementById('btn-agregar-carrito');
            if (p.precio.toUpperCase().includes('VENDID')) {
                btnCarrito.innerText = "Prenda No Disponible ✕";
                btnCarrito.disabled = true;
                btnCarrito.className = "w-full bg-gray-800 text-gray-500 py-4 rounded-xl font-bold uppercase tracking-wider cursor-not-allowed";
            } else {
                btnCarrito.innerText = "Agregar al Carrito 💋";
                btnCarrito.disabled = false;
                btnCarrito.className = "w-full bg-[#E01E37] text-white py-4 rounded-xl font-bold uppercase tracking-wider hover:bg-red-700 transition-all shadow-[0_0_20px_rgba(224,30,55,0.3)] active:scale-[0.98]";
            }
        }

        function toggleMusic() {
            const mc = document.getElementById('music-control');
            if(bgMusic.paused) { bgMusic.play(); mc.style.opacity = '1'; }
            else { bgMusic.pause(); mc.style.opacity = '0.5'; }
        }

        /* --- FUNCIONES DEL SITEMA DE CARRITO DE COMPRAS --- */
        function toggleCartSidebar() {
            const sidebar = document.getElementById('cart-sidebar');
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
            } else {
                sidebar.classList.add('translate-x-full');
            }
        }

        function agregarAlCarrito() {
            const p = prendas[indexActual];
            
            // Validar que no se repita el mismo item exacto en el carrito
            const existe = carrito.some(item => item.img === p.img && item.titulo === p.titulo);
            if(existe) {
                alert("Esta prenda ya se encuentra en tu carrito 💋");
                cerrar();
                return;
            }

            carrito.push(p);
            localStorage.setItem('val_store_cart', JSON.stringify(carrito));
            actualizarUI_Carrito();
            cerrar();
            toggleCartSidebar(); // Abre el carrito automáticamente para feedback visual premium
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            localStorage.setItem('val_store_cart', JSON.stringify(carrito));
            actualizarUI_Carrito();
        }

        function actualizarUI_Carrito() {
            const container = document.getElementById('cart-items-container');
            const badge = document.getElementById('cart-badge');
            const totalElement = document.getElementById('cart-total');
            
            container.innerHTML = '';
            let sumaTotal = 0;

            if(carrito.length === 0) {
                container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-center text-gray-500 py-12"><p class="text-sm">Tu carrito está vacío.</p><p class="text-xs mt-1">¡Añade tus prendas favoritas! 💋</p></div>`;
                badge.classList.add('hidden');
                totalElement.innerText = "Q0";
                return;
            }

            badge.innerText = carrito.length;
            badge.classList.remove('hidden');

            carrito.forEach((item, index) => {
                // Extraer el valor numérico del precio (ej: "Q25" -> 25)
                const valorNumerico = parseInt(item.precio.replace(/[^0-9]/g, '')) || 0;
                sumaTotal += valorNumerico;

                container.innerHTML += `
                    <div class="flex items-center gap-4 bg-white/5 p-3 rounded-xl border border-white/5 relative group">
                        <img src="${item.img}" class="w-16 h-20 object-cover rounded-lg">
                        <div class="flex-1 min-w-0">
                            <p class="text-[8px] font-black tracking-widest text-[#E01E37] uppercase truncate">${item.marca}</p>
                            <h4 class="text-xs font-bold text-white truncate">${item.titulo}</h4>
                            <p class="text-[10px] text-gray-400 font-mono mt-0.5">Talla: ${item.talla}</p>
                            <p class="text-sm font-black text-white mt-1">${item.precio}</p>
                        </div>
                        <button onclick="eliminarDelCarrito(${index})" class="text-gray-500 hover:text-red-500 p-2 transition duration-300">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        </button>
                    </div>
                `;
            });

            totalElement.innerText = `Q${sumaTotal}`;
        }

        function obtenerCodigoPrenda(item) {
            if (item.id) return item.id;

            const catalogIndex = prendas.findIndex(prenda => prenda.img === item.img);
            return catalogIndex >= 0
                ? `#${String(catalogIndex + 1).padStart(3, '0')}`
                : '#000';
        }

        function enviarPedidoWhatsApp() {
            if(carrito.length === 0) return;

            let mensaje = 'Hola me interesa la siguiente selección de prendas 💋\n\n';
            let total = 0;

            carrito.forEach((item, itemIndex) => {
                mensaje += `${itemIndex + 1}. 📌 ${item.titulo}\n`;
                mensaje += `- ID: ${obtenerCodigoPrenda(item)}\n`;
                mensaje += `- Marca: ${item.marca}\n`;
                mensaje += `- Talla: ${item.talla}\n`;
                mensaje += `- Precio: ${item.precio}\n`;
                mensaje += `- Imagen: ${item.img}\n\n`;
                
                const valor = parseInt(item.precio.replace(/[^0-9]/g, '')) || 0;
                total += valor;
            });

            mensaje += `🛍️ *Total estimado:* Q${total}\n`;
            mensaje += `¿Están disponibles para coordinar mi compra? ¡Gracias!`;

            const urlWA = `https://wa.me/50240283552?text=${encodeURIComponent(mensaje)}`;
            const cartIcon = document.querySelector('#cart-toggle-btn svg');
            const flyingCart = cartIcon.cloneNode(true);
            const cartBounds = cartIcon.getBoundingClientRect();
            flyingCart.classList.add('cart-flight');
            flyingCart.style.left = `${cartBounds.left}px`;
            flyingCart.style.top = `${cartBounds.top}px`;
            flyingCart.style.width = `${cartBounds.width}px`;
            flyingCart.style.height = `${cartBounds.height}px`;
            document.body.appendChild(flyingCart);
            flyingCart.addEventListener('animationend', () => flyingCart.remove(), { once: true });
            setTimeout(() => window.open(urlWA, '_blank'), 360);
        }
    </script>
</body>
</html>
