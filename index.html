<!DOCTYPE html>
<html lang="es">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAL_STORE💋 | Premium Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --brand-red: #E01E37; --bg-dark: #080808; --font-body: 'DM Sans', sans-serif; --font-display: 'Playfair Display', serif; }
        body { font-family: var(--font-body); background-color: var(--bg-dark); color: #ffffff; overflow-x: hidden; margin: 0; }

        .brand-wordmark {
            font-family: var(--font-display); font-style: italic; letter-spacing: -0.06em;
            background: linear-gradient(110deg, #fff 20%, #fff 42%, #E01E37 50%, #fff 58%, #fff 80%);
            background-size: 220% auto; background-clip: text; -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; animation: brandShine 6s linear infinite;
        }
        .brand-bounce { display: inline-block; animation: brandBounce 3.6s ease-in-out infinite; }
        @keyframes brandBounce {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            5% { transform: translateY(-4px) rotate(0deg); }
            10% { transform: translateY(0) rotate(-1deg); }
            88% { transform: translateY(0) rotate(-1deg); }
        }
        @keyframes brandShine { to { background-position: -220% center; } }
        .header-kiss { cursor: pointer; }
        #headerLogo {
            background: none; background-clip: border-box; -webkit-background-clip: border-box;
            -webkit-text-fill-color: #fff; color: #fff;
        }
        .kiss-o {
            display: inline-block; color: #e60023; -webkit-text-fill-color: #e60023;
            background: none; opacity: 1; cursor: pointer; transform-origin: center;
            user-select: none; font-style: normal; line-height: 1;
            animation: kissPulse 2s infinite ease-in-out;
            filter: drop-shadow(0 2px 4px rgba(230,0,35,0.28));
        }
        .kiss-o.intro-title-letter { animation: kissPulse 2s infinite ease-in-out; }
        @keyframes kissPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3) rotate(-5deg); }
        }

        /* --- PANTALLA HERO --- */
        #intro-bg {
            display: none;
        }

        #hero {
            position: fixed; inset: 0; z-index: 100;
            background: radial-gradient(circle at 50% 40%, #3c4b56 0%, #25343e 44%, #10191f 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            display: flex; opacity: 1; visibility: visible;
            transition: opacity 0.8s ease, transform 0.8s ease, perspective 0.8s ease;
            perspective: 1200px; transform-style: preserve-3d;
            animation: introBackgroundReveal 0.9s ease-out both;
        }
        @keyframes introBackgroundReveal {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .glow-hero {
            position: absolute; width: 52vw; height: 52vw; max-width: 560px; max-height: 560px;
            background: #8eb7c6; filter: blur(110px); opacity: 0.24;
        }

        .kiss-rain {
            position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0;
        }
        .kiss-drop {
            position: absolute; top: -10vh; left: var(--left);
            font-size: var(--size); line-height: 1;
            color: rgba(255, 43, 78, 0.95);
            text-shadow: 0 0 8px rgba(255, 43, 78, 0.6);
            filter: drop-shadow(0 0 8px rgba(255, 43, 78, 0.35));
            opacity: 0;
            animation: kissRainFall var(--duration) linear infinite;
            animation-delay: var(--delay);
            transform: translate3d(0, 0, 0) scale(0.8);
            will-change: transform, opacity;
        }
        @keyframes kissRainFall {
            0% {
                opacity: 0;
                transform: translate3d(0, -8vh, 0) scale(0.65) rotate(-8deg);
            }
            12% { opacity: 1; }
            100% {
                opacity: 0;
                transform: translate3d(var(--drift), 110vh, 0) scale(1.15) rotate(10deg);
            }
        }

        .intro-stage {
            position: relative; z-index: 2; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 1.75rem;
            transform-style: preserve-3d; transition: transform 0.18s ease-out;
            will-change: transform;
            animation: introStageReveal 0.8s 0.18s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes introStageReveal {
            from { opacity: 0; transform: translate3d(0, 18px, -24px) scale(0.96); }
            to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }
        .intro-panel {
            display: flex; flex-direction: column; align-items: center; gap: 0.9rem;
            padding: 2.5rem 3.5rem 2.25rem; border: 1px solid rgba(255,255,255,0.76);
            border-radius: 30px; background: rgba(255,255,255,0.56); backdrop-filter: blur(20px);
            box-shadow: 0 28px 70px rgba(61,87,105,0.16), inset 0 1px rgba(255,255,255,0.9);
            transform: translateZ(35px); transform-style: preserve-3d;
            animation: introPanelReveal 0.75s 0.34s ease-out both;
        }
        @keyframes introPanelReveal {
            from { opacity: 0; transform: translate3d(0, 20px, 35px) scale(0.96); }
            to { opacity: 1; transform: translate3d(0, 0, 35px) scale(1); }
        }
        .intro-brand { color: #142531; text-align: center; }
        .intro-brand .brand-wordmark {
            background: none; -webkit-text-fill-color: #18242c; color: #18242c;
            text-shadow: 0 3px 0 rgba(255,255,255,0.7), 0 8px 18px rgba(20,37,49,0.2);
        }
        .intro-title {
            display: block; visibility: visible; opacity: 1; position: relative; z-index: 4;
            width: 100%; max-width: 100%; box-sizing: border-box; text-align: center;
            color: #18242c; -webkit-text-fill-color: #18242c;
        }
        .intro-title-letter { display: inline-block; animation: introLetterWave 3.8s ease-in-out infinite; }
        @keyframes introLetterWave {
            0%, 76%, 100% { transform: translateY(0) rotate(0); }
            82% { transform: translateY(-6px) rotate(-2deg); }
            88% { transform: translateY(1px) rotate(1deg); }
        }
        .intro-kiss { margin-top: -0.25rem; font-size: 2rem; filter: drop-shadow(0 6px 8px rgba(224,30,55,0.18)); }
        .intro-button {
            transform: translateZ(52px); color: #fff; border: 1px solid rgba(255,255,255,0.7);
            background: rgba(20,37,49,0.88); box-shadow: 0 14px 30px rgba(20,37,49,0.2);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            animation: introButtonReveal 0.7s 0.7s ease-out both;
        }
        @keyframes introButtonReveal {
            from { opacity: 0; transform: translate3d(0, 18px, 52px) scale(0.94); }
            to { opacity: 1; transform: translate3d(0, 0, 52px) scale(1); }
        }
        .intro-button:hover { transform: translateZ(70px) scale(1.05); background: var(--brand-red); box-shadow: 0 16px 35px rgba(224,30,55,0.22); }
        #hero.intro-exit .intro-stage { animation: introExit 0.8s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
        @keyframes introExit {
            to { opacity: 0; transform: translate3d(0, -10vh, 180px) rotateX(-14deg) scale(1.08); }
        }

        .heart-particle {
            position: fixed; z-index: 450; pointer-events: none; line-height: 1;
            font-size: var(--heart-size); opacity: 0;
            animation: heartRise var(--heart-duration) cubic-bezier(0.22, 1, 0.36, 1) forwards;
            will-change: transform, opacity;
        }
        @keyframes heartRise {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.35) rotate(0deg); }
            14% { opacity: 1; }
            100% { opacity: 0; transform: translate(calc(-50% + var(--heart-x)), calc(-50% - var(--heart-y))) scale(1.15) rotate(var(--heart-rotation)); }
        }
        @media (prefers-reduced-motion: reduce) {
            #hero, .intro-stage, .intro-panel, .intro-button, .intro-title-letter, .heart-particle, .kiss-drop { animation: none; transition: none; }
        }

        /* --- UI COMPONENTS --- */
        .glass-nav {
            background: rgba(8, 8, 8, 0.85); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            opacity: 0; transition: opacity 0.8s ease;
        }

        .category-btn {
            position: relative; font-weight: 600; font-size: 0.8rem; color: #888;
            transition: all 0.3s; padding: 0.5rem 1rem;
        }
        .category-btn.active { color: #fff; }
        .category-btn.active::after {
            content: ''; position: absolute; bottom: 0; left: 25%; width: 50%;
            height: 2px; background: var(--brand-red);
        }

        .catalog-search {
            display: flex; align-items: center; gap: 0.55rem; min-width: 170px;
            color: rgba(255,255,255,0.72); background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 999px;
            padding: 0.55rem 0.85rem; transition: border-color 0.25s, background 0.25s;
        }
        .catalog-search:focus-within { background: rgba(255,255,255,0.11); border-color: rgba(224,30,55,0.75); }
        .catalog-search input {
            width: 100%; min-width: 0; color: #fff; background: transparent; border: 0; outline: 0;
            font: 500 0.78rem var(--font-body);
        }
        .catalog-search input::placeholder { color: rgba(255,255,255,0.48); }
        .empty-results {
            grid-column: 1 / -1; min-height: 180px; display: grid; place-items: center;
            color: rgba(255,255,255,0.62); text-align: center; font-size: 0.95rem;
        }

        .product-card {
            background: #111; border-radius: 16px; overflow: hidden;
            transition: all 0.4s ease; border: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }
        .product-card:hover { transform: translateY(-5px); border-color: rgba(224, 30, 55, 0.4); }

        /* Animación de entrada de productos */
        .reveal-up { animation: revealUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; opacity: 0; }
        @keyframes revealUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Nueva animación visual para prendas en el modal */
        @keyframes imagePop {
            0% { opacity: 0; transform: scale(0.9) translateY(15px); filter: blur(5px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        .anim-pop {
            animation: imagePop 0.45s ease-in-out forwards;
            will-change: opacity, transform, filter;
        }

        #m-img {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }

        .cart-flight {
            position: fixed; z-index: 500; pointer-events: none; color: #E01E37;
            animation: cartFly 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes cartFly {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(115vw, -12vh) scale(0.7) rotate(18deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .brand-bounce, .cart-flight { animation: none; }
        }

        /* Ocultar barra de scroll en el modal en móviles */
        .no-scrollbar::-webkit-scrollbar { display: none; }

        @media (max-width: 768px) {
            #hero {
                max-width: 100vw; overflow-x: hidden; box-sizing: border-box;
                padding: 0 15px;
            }
            .intro-stage { width: 100%; max-width: 100%; box-sizing: border-box; }
            .intro-panel {
                width: min(100%, 22rem); max-width: 100%; box-sizing: border-box;
                padding: 2rem 1.25rem 1.75rem;
            }
            .intro-brand { max-width: 100%; width: 100%; box-sizing: border-box; text-align: center; }
            .intro-brand .brand-wordmark {
                max-width: 100%; box-sizing: border-box;
                width: 100%; font-size: clamp(1.4rem, 6.5vw, 2.5rem);
                text-align: center; white-space: nowrap; overflow: hidden;
            }
            .intro-button { max-width: 100%; padding-left: 1.75rem; padding-right: 1.75rem; }

            #main-nav {
                position: relative !important; padding: 8px 12px; box-sizing: border-box;
            }
            #main-nav > div {
                display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
                gap: 8px; width: 100%; max-width: none;
            }
            #main-nav .brand-logo {
                order: 1; flex: 0 1 auto; width: auto; max-width: 100%;
                min-width: 0; font-size: 1.1rem; white-space: nowrap;
            }
            #main-nav > div > .flex.items-center {
                order: 2; flex: 1 1 100%; min-width: 0; width: 100%;
                display: flex; align-items: center; justify-content: flex-end; gap: 8px;
            }
            #main-nav .catalog-search {
                flex: 1 1 auto; min-width: 130px; max-width: none;
                height: 32px; max-width: 160px; padding: 2px 10px;
                font-size: 0.8rem; box-sizing: border-box;
            }
            #main-nav .catalog-search input { font-size: 0.8rem; min-width: 0; }
            #main-nav > div > .flex.items-center > a,
            #main-nav #music-control {
                flex: 0 0 auto; min-width: 36px; min-height: 36px;
                display: inline-flex; align-items: center; justify-content: center;
                padding: 8px; box-sizing: border-box;
            }
            #main-nav #music-control { padding-left: 8px; border-left: 1px solid rgba(255,255,255,0.2); }

            #mobile-nav {
                clear: both; display: flex; position: relative; z-index: 80;
                flex-wrap: wrap; width: 100%; box-sizing: border-box;
                margin-top: 10px !important; padding: 0 12px;
            }
        }
    </style>
</head>

            <span class="kiss-drop" style="--left: 74%; --size: 0.85rem; --duration: 6.7s; --delay: -1.2s; --drift: 12px;">💋</span>

                <div class="intro-brand">
                    <div class="brand-wordmark intro-title text-4xl md:text-6xl font-bold" aria-label="VAL_ST💋RE">
                        <span class="intro-title-letter" style="animation-delay: 0s">V</span><span class="intro-title-letter" style="animation-delay: 0.08s">A</span><span class="intro-title-letter" style="animation-delay: 0.16s">L</span><span class="intro-title-letter" style="animation-delay: 0.24s">_</span><span class="intro-title-letter" style="animation-delay: 0.32s">S</span><span class="intro-title-letter" style="animation-delay: 0.4s">T</span><span class="kiss-o intro-title-letter" style="animation-delay: 0.48s">💋</span><span class="intro-title-letter" style="animation-delay: 0.56s">R</span><span class="intro-title-letter" style="animation-delay: 0.64s">E</span>

                </div>
                
                <div class="mt-auto w-full pb-2">
                    <button id="btn-agregar-carrito" onclick="agregarAlCarrito()" class="w-full bg-[#E01E37] text-white py-4 rounded-xl font-bold uppercase tracking-wider hover:bg-red-700 transition-all shadow-[0_0_20px_rgba(224,30,55,0.3)] active:scale-[0.98]">
                        Agregar al Carrito 💋
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- --- BOTÓN FLOTANTE DEL CARRITO --- -->
    <div id="cart-toggle-btn" onclick="toggleCartSidebar()" class="fixed bottom-[20px] right-[20px] z-[1000] bg-white text-black p-4 rounded-full shadow-[0_0_25px_rgba(255,255,255,0.2)] cursor-pointer hover:bg-[#E01E37] hover:text-white transition-all duration-300 transform hover:scale-110 hidden items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span id="cart-badge" class="absolute -top-1 -right-1 bg-[#E01E37] text-white text-[10px] font-black px-2 py-0.5 rounded-full border border-black hidden">0</span>
    </div>

    <!-- --- SIDEBAR DEL CARRITO --- -->
    <div id="cart-sidebar" class="fixed top-0 right-0 h-[100dvh] w-full sm:w-[400px] bg-[#0c0c0c] z-[300] shadow-[-10px_0_40px_rgba(0,0,0,0.8)] border-l border-white/5 flex flex-col translate-x-full transition-transform duration-500 ease-out">
        <div class="p-6 border-b border-white/5 flex justify-between items-center">
            <h3 class="text-xl font-black uppercase tracking-wider">Tu Carrito <span class="text-[#E01E37]">💋</span></h3>
            <button onclick="toggleCartSidebar()" class="text-gray-400 hover:text-white font-bold text-sm bg-white/5 px-4 py-2 rounded-full border border-white/10 transition">✕ Cerrar</button>
        </div>

        <div id="cart-items-container" class="flex-1 overflow-y-auto no-scrollbar p-6 space-y-4">
            <!-- Los items agregados aparecerán aquí dinámicamente -->
        </div>

        <div class="p-6 border-t border-white/5 bg-[#111] space-y-4">
            <div class="flex justify-between items-center font-bold">
                <span class="text-gray-400">Total Estimado:</span>
                <span id="cart-total" class="text-2xl font-black text-white">Q0</span>
            </div>
            <button onclick="enviarPedidoWhatsApp()" class="w-full bg-green-600 text-white py-4 rounded-xl font-black uppercase tracking-widest hover:bg-green-700 transition-all shadow-[0_0_20px_rgba(22,163,74,0.2)] active:scale-[0.98] flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                Confirmar Pedido (WA)
            </button>
        </div>
    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>
